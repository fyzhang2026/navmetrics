[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navmetrics"
version = "0.1.0"
description = "Performance metrics from a strategy NAV curve and a benchmark NAV curve."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "finance",
    "portfolio",
    "performance",
    "sharpe",
    "drawdown",
    "backtest",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/fyzhang2026/navmetrics"
Repository = "https://github.com/fyzhang2026/navmetrics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navmetrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
